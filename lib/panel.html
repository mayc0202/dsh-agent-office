:root{--ink:#F2F0EA;--dim:#8E8D93;--faint:#55555C;--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.13);--acc:#FF6A3D;--ok:#6FD49A;--bad:#F0604E;--wait:#E9C17A}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#060607;color:var(--ink);font-family:G,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#stage{position:fixed;left:0;top:0;width:100vw;height:100vh;overflow:hidden;background:radial-gradient(1200px 900px at 50% 30%,#17120F 0%,#0A0A0B 55%,#060607 100%)}
#sky{position:absolute;inset:0;background:radial-gradient(700px 500px at 20% 0%,rgba(255,106,61,.16),transparent 70%),radial-gradient(600px 500px at 100% 100%,rgba(255,106,61,.08),transparent 70%)}
svg#w{position:absolute;inset:0;width:100%;height:100%}
.pn{position:absolute;background:linear-gradient(180deg,rgba(28,28,32,.86),rgba(18,18,21,.86));border:1px solid var(--line2);border-radius:18px;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 20px 50px rgba(0,0,0,.45);backdrop-filter:blur(8px)}
#top{left:24px;right:24px;top:22px;height:64px;display:flex;align-items:center;gap:14px;padding:0 16px}
#top .lg{display:flex;align-items:center;gap:10px;font-weight:600;font-size:20px;letter-spacing:-.3px}
#top .lg i{width:24px;height:24px;border-radius:50%;background:var(--ink);position:relative}#top .lg i:after{content:"";position:absolute;right:-2px;top:-2px;width:9px;height:9px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
