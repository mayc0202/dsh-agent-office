<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Night Shift · DSH 会话办公室</title>
<style>
  :root{
    --bg:#05070a;
    --panel:rgba(12,15,20,.66);
    --panel-2:rgba(17,21,28,.78);
    --line:rgba(255,255,255,.08);
    --line-2:rgba(255,255,255,.14);
    --ink:#e9eef5;
    --dim:#8a94a3;
    --dim-2:#5d6673;
    --acc:#3de1c6;
    --acc-2:#2aa896;
    --amber:#ffb86b;
    --red:#ff6b6b;
    --green:#7dd3a0;
    --purple:#a78bfa;
    --radius:18px;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:Inter,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0;overflow:hidden}
  #stage{position:absolute;inset:0}
  #stage canvas{display:block;width:100%;height:100%}
  #labels{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:4}
  #labels .lbl{pointer-events:auto;cursor:pointer}

  /* ---------- 顶部 ---------- */
  #top{position:absolute;left:18px;right:18px;top:16px;height:58px;display:flex;align-items:center;gap:16px;padding:0 18px;border:1px solid var(--line);border-radius:16px;background:var(--panel);backdrop-filter:blur(16px);z-index:10}
  .brand{display:flex;align-items:center;gap:11px;white-space:nowrap}
  .brand .mark{width:26px;height:26px;border-radius:9px;background:conic-gradient(from 210deg,#3de1c6,#5b8cff,#a78bfa,#3de1c6);box-shadow:0 0 18px rgba(61,225,198,.35);position:relative}
  .brand .mark:after{content:"";position:absolute;inset:7px;border-radius:4px;background:#070b0e}
  .brand b{font-size:17px;font-weight:650;letter-spacing:-.2px}
  .brand span{font-family:var(--mono);font-size:11px;letter-spacing:1.6px;color:var(--dim);margin-left:2px}
  .pills{display:flex;gap:8px;margin-left:auto}
  .pill{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
  .pill i{width:7px;height:7px;border-radius:50%;background:var(--dim-2)}
  .pill b{color:var(--ink);font-weight:600;font-size:13px}
  .pill.working i{background:var(--acc);box-shadow:0 0 8px var(--acc)}
  .pill.need i{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .pill.stuck i{background:var(--red);box-shadow:0 0 8px var(--red)}
  #clock{font-family:var(--mono);font-size:12px;color:var(--dim);display:flex;align-items:center;gap:8px;white-space:nowrap}
  #clock i{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);animation:breathe 2.4s ease-in-out infinite}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}

  /* ---------- 面板通用 ---------- */
  .panel{position:absolute;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel);backdrop-filter:blur(16px);box-shadow:0 22px 60px rgba(0,0,0,.45);z-index:9}
  .panel__head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;font-family:var(--mono);font-size:11px;letter-spacing:1.8px;color:var(--dim)}
  .panel__head b{margin-left:auto;color:var(--dim);font-weight:500;letter-spacing:1px}
  .panel__body{padding:0 10px 12px}

  /* ---------- 左侧榜单 ---------- */
  #board{left:18px;top:92px;width:326px;max-height:calc(100vh - 92px - 190px);display:flex;flex-direction:column}
  #board .panel__body{overflow:auto;scrollbar-width:thin;scrollbar-color:#242a34 transparent}
  #board .panel__body::-webkit-scrollbar{width:6px}
  #board .panel__body::-webkit-scrollbar-thumb{background:#242a34;border-radius:3px}
  .row{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:12px;cursor:pointer;transition:background .15s}
  .row:hover{background:rgba(255,255,255,.045)}
  .row.on{background:rgba(61,225,198,.1);box-shadow:inset 0 0 0 1px rgba(61,225,198,.28)}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .row__main{flex:1;min-width:0}
  .row__name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row__sub{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .row__bar{height:3px;border-radius:2px;background:rgba(255,255,255,.06);margin-top:6px;overflow:hidden}
  .row__bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--acc-2),var(--acc))}
  .row__pct{font-family:var(--mono);font-size:13px;color:var(--ink);flex:none;min-width:42px;text-align:right}

  /* ---------- 楼层 ---------- */
  #floors{left:18px;bottom:18px;width:326px}
  #floors .panel__body{display:flex;flex-direction:column;gap:4px}
  .floor{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;cursor:pointer;font-size:13px}
  .floor:hover{background:rgba(255,255,255,.045)}
  .floor.on{background:rgba(61,225,198,.1)}
  .floor__no{width:22px;height:22px;border-radius:7px;background:rgba(255,255,255,.06);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .floor.on .floor__no{background:rgba(61,225,198,.2);color:var(--acc)}
  .floor__ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim)}

  /* ---------- 右侧 ---------- */
  #right{position:absolute;right:18px;top:92px;width:346px;display:flex;flex-direction:column;gap:14px;z-index:9;max-height:calc(100vh - 92px - 170px)}
  #card{position:relative;display:none}
  #card.show{display:block}
  #card .panel__head b{margin-left:0;margin-right:26px;color:var(--dim)}
  #cardx{position:absolute;top:12px;right:12px;width:26px;height:26px;border-radius:50%;border:1px solid var(--line-2);background:rgba(255,255,255,.05);color:var(--dim);font-size:15px;line-height:1;cursor:pointer;z-index:2}
  #cardx:hover{color:var(--ink);background:rgba(255,255,255,.12)}
  .card__title{display:flex;align-items:center;gap:10px;padding:0 16px 8px}
  .card__title .glyph{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex:none}
  .card__title b{font-size:16px;font-weight:650;line-height:1.25;word-break:break-all}
  .card__title span{display:block;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px}
  .card__status{margin:0 16px;display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;font-family:var(--mono);font-size:11.5px;border:1px solid}
  .card__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px 4px}
  .card__grid div{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:10px}
  .card__grid b{display:block;font-family:var(--mono);font-size:19px;font-weight:650;letter-spacing:-.5px}
  .card__grid span{font-family:var(--mono);font-size:9.5px;letter-spacing:1.2px;color:var(--dim)}
  .card__row{display:flex;justify-content:space-between;gap:12px;margin:10px 16px 0;padding-top:10px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--dim)}
  .card__row b{color:var(--ink);font-weight:500;text-align:right;word-break:break-all;max-width:220px}
  .card__foot{height:10px}

  #checks .panel__body{display:flex;flex-direction:column;gap:7px}
  .check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);font-family:var(--mono)}
  .check i{width:15px;height:15px;border-radius:5px;border:1px solid var(--line-2);display:grid;place-items:center;font-style:normal;font-size:10px;color:transparent}
  .check.ok{color:var(--ink)}
  .check.ok i{background:rgba(125,211,160,.14);border-color:rgba(125,211,160,.4);color:var(--green)}

  /* ---------- 动态 ---------- */
  #feed{left:358px;bottom:18px;width:min(520px,calc(100vw - 358px - 386px))}
  #feed .panel__body{display:flex;flex-direction:column;gap:2px}
  .evt{display:flex;align-items:center;gap:9px;padding:5px 6px;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .evt .t{font-family:var(--mono);font-size:10.5px;color:var(--dim-2);flex:none}
  .evt i{width:6px;height:6px;border-radius:50%;flex:none}
  .evt b{color:var(--ink);font-weight:600;flex:none;max-width:150px;overflow:hidden;text-overflow:ellipsis}
  .evt span{overflow:hidden;text-overflow:ellipsis}
  .evt.empty{color:var(--dim-2);font-family:var(--mono);font-size:11px;letter-spacing:1px}

  /* ---------- 用量 ---------- */
  #meter{right:18px;bottom:18px;width:346px}
  #meter .panel__body{padding:0 16px 16px}
  #meter .big{font-family:var(--mono);font-size:40px;font-weight:650;letter-spacing:-2px;line-height:1.05;margin-top:2px}
  #meter .big small{font-size:14px;font-weight:500;color:var(--dim);letter-spacing:0;margin-left:6px}
  #meter .sub{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:8px}
  #meter .sub b{color:var(--ink);font-weight:500}

  /* ---------- 提示/空态 ---------- */
  #hint{position:absolute;left:50%;top:92px;transform:translateX(-50%);z-index:8;font-family:var(--mono);font-size:11px;letter-spacing:1.2px;color:rgba(138,148,163,.85);background:rgba(12,15,20,.66);border:1px solid var(--line);border-radius:999px;padding:7px 14px;backdrop-filter:blur(12px);transition:opacity .8s;white-space:nowrap}
  #hint.hide{opacity:0}
  #offline{position:absolute;left:50%;top:88px;transform:translateX(-50%);z-index:20;display:none;font-family:var(--mono);font-size:11.5px;color:var(--amber);background:rgba(255,184,107,.12);border:1px solid rgba(255,184,107,.35);border-radius:999px;padding:6px 14px}
  #offline.show{display:block}
  .lbl{position:absolute;transform:translate(-50%,-100%);padding:3px 8px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(8,11,15,.82);color:var(--ink);font-family:var(--mono);font-size:10.5px;white-space:nowrap;backdrop-filter:blur(6px);transition:border-color .2s,transform .2s}
  .lbl em{font-style:normal;color:var(--dim);margin-left:6px}
  .lbl:hover{border-color:rgba(61,225,198,.6);transform:translate(-50%,-100%) scale(1.06)}
  .lbl.on{border-color:var(--acc);box-shadow:0 0 14px rgba(61,225,198,.35)}
  .lbl .badge{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
  .floorlbl{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:11px;letter-spacing:2px;color:rgba(138,148,163,.9);padding:3px 9px;border:1px solid rgba(255,255,255,.1);border-radius:999px;background:rgba(8,11,15,.6);white-space:nowrap}
  .floorlbl b{color:var(--ink);font-weight:600;margin-left:6px;letter-spacing:0}
  @media (max-width:1180px){
    #board,#floors{width:280px}
    #right,#meter{width:300px}
    #feed{width:420px}
    .brand span{display:none}
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="labels"></div>

  <header id="top">
    <div class="brand"><span class="mark"></span><b>Night Shift</b><span>DSH LIVE OFFICE</span></div>
    <div class="pills" id="pills"></div>
    <div id="clock"><i></i><span>实时</span></div>
  </header>

  <aside id="board" class="panel">
    <div class="panel__head"><span>本周 TOKEN 占比</span><b>TOP</b></div>
    <div class="panel__body" id="boardBody"></div>
  </aside>

  <aside id="floors" class="panel">
    <div class="panel__head"><span>楼层 / 团队</span><b id="floorCount"></b></div>
    <div class="panel__body" id="floorBody"></div>
  </aside>

  <aside id="right">
    <section id="card" class="panel">
      <button id="cardx" title="关闭">×</button>
      <div class="panel__head"><span>会话详情</span><b id="cardTeam"></b></div>
      <div class="card__title"><span class="glyph" id="cardGlyph">◆</span><div><b id="cardName"></b><span id="cardSub"></span></div></div>
      <div class="card__status" id="cardStatus"></div>
      <div class="card__grid">
        <div><b id="cardRuns">0</b><span>今日执行</span></div>
        <div><b id="cardShare">0%</b><span>本周占比</span></div>
        <div><b id="cardTokens">0</b><span>今日 TOKEN</span></div>
      </div>
      <div class="card__row"><span>调度</span><b id="cardSched"></b></div>
      <div class="card__row"><span>当前</span><b id="cardNow"></b></div>
      <div class="card__foot"></div>
    </section>
    <section id="checks" class="panel">
      <div class="panel__head"><span>运行检查</span><b id="checkScore"></b></div>
      <div class="panel__body" id="checkBody"></div>
    </section>
  </aside>

  <footer id="feed" class="panel">
    <div class="panel__head"><span>动态</span><b>实时</b></div>
    <div class="panel__body" id="feedBody"></div>
  </footer>

  <footer id="meter" class="panel">
    <div class="panel__head"><span>本周 TOKEN</span><b id="meterSpan">周一至今</b></div>
    <div class="panel__body">
      <div class="big" id="meterBig">0<small>tokens</small></div>
      <div class="sub"><span>今日 <b id="meterToday">0</b></span><span>每天唤醒 <b id="meterWake">0</b> 次</span></div>
    </div>
  </footer>

  <div id="hint">拖动旋转 · 滚轮缩放 · 点击会话查看详情</div>
  <div id="offline">正在连接 DSH 会话数据…</div>
</div>
