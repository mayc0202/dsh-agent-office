<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Office · DSH 会话办公室</title>
<style>
  :root{
    --bg:#05070a;
    --panel-rgb:12 15 20;
    --panel-alpha:.52;
    --glass-line:rgba(255,255,255,.24);
    --glass-tint:rgba(255,255,255,.09);
    --glass-shine:rgba(255,255,255,.2);
    --panel-2:rgba(17,21,28,.78);
    --line:rgba(255,255,255,.08);
    --line-2:rgba(255,255,255,.14);
    --ink:#e9eef5;
    --dim:#8a94a3;
    --dim-2:#5d6673;
    --acc:#3de1c6;
    --acc-2:#2aa896;
    --amber:#ffb86b;
    --red:#ff6b6b;
    --green:#7dd3a0;
    --purple:#a78bfa;
    --surface:rgba(255,255,255,.035);
    --surface-hover:rgba(255,255,255,.045);
    --surface-active:rgba(61,225,198,.1);
    --active-line:rgba(61,225,198,.28);
    --track:rgba(255,255,255,.06);
    --scroll:rgba(255,255,255,.2);
    --scroll-hi:rgba(255,255,255,.32);
    --label:rgba(8,11,15,.82);
    --hint:rgba(12,15,20,.66);
    --chip:rgba(12,18,22,.86);
    --focus-line:rgba(61,225,198,.3);
    --focus-btn:rgba(61,225,198,.16);
    --focus-btn-hi:rgba(61,225,198,.26);
    --check-bg:rgba(125,211,160,.14);
    --check-line:rgba(125,211,160,.4);
    --shadow:0 22px 60px rgba(0,0,0,.45);
    --radius:14px;
    --hud-scale:.78;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
    --sans:Inter,system-ui,-apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased}
  #app{position:fixed;inset:0;overflow:hidden}
  #stage{position:absolute;inset:0}
  #stage canvas{display:block;width:100%;height:100%}
  #labels{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:4}
  #labels .lbl{pointer-events:auto;cursor:pointer}

  /* ---------- 顶部 ---------- */
  #top{zoom:var(--hud-scale);box-shadow:0 10px 30px rgba(0,0,0,.18);position:absolute;left:18px;right:18px;top:16px;height:58px;display:flex;align-items:center;gap:16px;padding:0 18px;border:1px solid var(--glass-line);border-radius:16px;background:linear-gradient(145deg,var(--glass-tint),transparent 36%,transparent 72%,var(--glass-tint)),rgb(var(--panel-rgb) / var(--panel-alpha));backdrop-filter:blur(26px) saturate(1.65);-webkit-backdrop-filter:blur(26px) saturate(1.65);z-index:10}
  .brand{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
  .brand b{font-size:17px;font-weight:650;letter-spacing:-.2px}
  .brand span{font-family:var(--mono);font-size:11px;letter-spacing:.8px;color:var(--dim)}
  body.day{
    --bg:#b9cbd8;
    --panel-rgb:248 251 252;
    --panel-alpha:.52;
    --glass-line:rgba(255,255,255,.72);
    --glass-tint:rgba(255,255,255,.3);
    --glass-shine:rgba(255,255,255,.85);
    --panel-2:rgba(255,255,255,.94);
    --line:rgba(16,40,54,.12);
    --line-2:rgba(16,40,54,.2);
    --ink:#102029;
    --dim:#455965;
    --dim-2:#5d707d;
    --acc:#087565;
    --acc-2:#075e52;
    --amber:#8a4d0f;
    --red:#a83232;
    --green:#256b45;
    --purple:#5b4a9e;
    --surface:rgba(16,40,54,.045);
    --surface-hover:rgba(16,40,54,.065);
    --surface-active:rgba(8,117,101,.1);
    --active-line:rgba(8,117,101,.3);
    --track:rgba(16,40,54,.07);
    --scroll:rgba(16,40,54,.2);
    --scroll-hi:rgba(16,40,54,.32);
    --label:rgba(250,252,253,.95);
    --hint:rgba(250,252,253,.84);
    --chip:rgba(252,253,254,.92);
    --focus-line:rgba(8,117,101,.3);
    --focus-btn:rgba(8,117,101,.12);
    --focus-btn-hi:rgba(8,117,101,.2);
    --check-bg:rgba(37,107,69,.12);
    --check-line:rgba(37,107,69,.4);
    --shadow:0 16px 42px rgba(27,52,68,.14);
  }
  body.day #top{zoom:var(--hud-scale);box-shadow:0 10px 26px rgba(27,52,68,.1)}
  body.day #clock i{box-shadow:none}
  body.day .panel,body.day #top,body.day .lbl,body.day .floorlbl,body.day #hint,body.day #focusChip{transition:background-color .45s,border-color .45s,color .45s,box-shadow .45s}
  .pills{display:flex;gap:8px;margin-left:auto}
  .pill{display:flex;align-items:center;gap:7px;height:30px;padding:0 12px;border:1px solid var(--line);border-radius:999px;font-family:var(--mono);font-size:12px;color:var(--dim);white-space:nowrap}
  .pill i{width:7px;height:7px;border-radius:50%;background:var(--dim-2)}
  .pill b{color:var(--ink);font-weight:600;font-size:13px;font-variant-numeric:tabular-nums}
  .pill.working i{background:var(--acc);box-shadow:0 0 8px var(--acc)}
  .pill.need i{background:var(--amber);box-shadow:0 0 8px var(--amber)}
  .pill.stuck i{background:var(--red);box-shadow:0 0 8px var(--red)}
  #clock{font-family:var(--mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--dim);display:flex;align-items:center;gap:8px;white-space:nowrap}
  #clock i{width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc);animation:breathe 2.4s ease-in-out infinite}
  #headStats{position:static;transform:none;margin-left:16px;display:flex;align-items:center;gap:18px;white-space:nowrap;pointer-events:auto}
  .hstat{display:flex;align-items:baseline;gap:7px;font-family:var(--mono);font-size:10.5px;letter-spacing:1.2px;color:var(--dim)}
  .hstat + .hstat{border-left:1px solid var(--line-2);padding-left:18px}
  .hstat b{font-family:var(--mono);font-size:15px;font-weight:800;letter-spacing:-.2px;color:var(--ink);font-variant-numeric:tabular-nums}
  .hstat small{font-family:var(--mono);font-size:9.5px;color:var(--dim-2);letter-spacing:.4px}
  @media (max-width:1420px){
    #headStats{gap:14px}
    .hstat + .hstat{padding-left:14px}
  }
  @media (max-width:1240px){
    .hstat.tokens{display:none}
    .hstat + .hstat{border-left:0;padding-left:0}
  }
  @media (max-width:1050px){#headStats{display:none}}
  @keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}

  /* ---------- 面板通用 ---------- */
  .panel{position:absolute;border:1px solid var(--glass-line);border-radius:var(--radius);background:linear-gradient(145deg,var(--glass-tint),transparent 34%,transparent 70%,var(--glass-tint)),rgb(var(--panel-rgb) / var(--panel-alpha));backdrop-filter:blur(26px) saturate(1.65);-webkit-backdrop-filter:blur(26px) saturate(1.65);box-shadow:inset 0 1px 0 var(--glass-shine),inset 0 0 0 1px rgba(255,255,255,.035),var(--shadow);z-index:9}
  .panel__head{display:flex;align-items:center;gap:8px;padding:14px 16px 10px;font-family:var(--mono);font-size:11px;letter-spacing:1.8px;color:var(--dim)}
  .panel__head b{margin-left:auto;color:var(--dim);font-weight:500;letter-spacing:1px;font-variant-numeric:tabular-nums}
  .panel__body{padding:0 10px 12px}

  /* ---------- 左侧栏：榜单 + 楼层 ---------- */
  #left{position:fixed;left:18px;top:78px;bottom:auto;width:326px;zoom:var(--hud-scale);max-height:calc(100vh - 110px);display:flex;flex-direction:column;gap:14px;z-index:9;min-height:0}
  #left > .panel{position:relative;left:auto;top:auto;bottom:auto}
  #board{position:relative;left:auto;top:auto;width:auto;flex:0 1 auto;min-height:0;max-height:calc(100vh - 110px);display:flex;flex-direction:column;overflow:hidden}
  #board .panel__body{max-height:calc(100vh - 180px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding-right:8px;scrollbar-gutter:stable;scrollbar-width:thin;scrollbar-color:var(--scroll-hi) transparent}
  #board .panel__body::-webkit-scrollbar{width:8px}
  #board .panel__body::-webkit-scrollbar-track{background:var(--track);border-radius:4px}
  #board .panel__body::-webkit-scrollbar-thumb{background:var(--scroll-hi);border-radius:4px;border:2px solid transparent;background-clip:padding-box}
  #board .panel__body::-webkit-scrollbar-thumb:hover{background:var(--scroll-hi)}
  .row{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:8px;cursor:pointer;transition:background .15s;appearance:none;width:100%;border:0;background:transparent;color:inherit;font:inherit;text-align:left}
  .row:hover{background:var(--surface-hover)}
  .row:active{background:var(--surface-active)}
  .row:focus-visible,.floor:focus-visible{outline:2px solid rgba(61,225,198,.55);outline-offset:1px}
  .row.on{background:var(--surface-active);box-shadow:inset 0 0 0 1px var(--active-line)}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .row__main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .row__name{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .row__sub{font-family:var(--mono);font-size:10.5px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .row__bar{display:block;height:3px;border-radius:2px;background:var(--track);margin-top:4px;overflow:hidden}
  .row__bar i{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--acc-2),var(--acc))}
  .row__pct{font-family:var(--mono);font-size:13px;color:var(--ink);flex:none;min-width:42px;text-align:right;font-variant-numeric:tabular-nums}

  /* ---------- 楼层 ---------- */
  #floors{position:relative;left:auto;bottom:auto;width:auto;flex:none}
  #floors .panel__body{display:flex;flex-direction:column;gap:4px;max-height:min(30vh,238px);overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scrollbar-gutter:stable}
  #floors .panel__body::-webkit-scrollbar{width:8px}
  #floors .panel__body::-webkit-scrollbar-track{background:var(--track);border-radius:4px}
  #floors .panel__body::-webkit-scrollbar-thumb{background:var(--scroll);border-radius:4px}
  #floors .panel__body::-webkit-scrollbar-thumb:hover{background:var(--scroll-hi)}
  .floor{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:13px;appearance:none;width:100%;border:0;background:transparent;color:inherit;font:inherit;text-align:left}
  .floor:hover{background:var(--surface-hover)}
  .floor:active{background:var(--surface-active)}
  .floor.on{background:var(--surface-active)}
  .floor__no{width:22px;height:22px;border-radius:7px;background:var(--surface);display:grid;place-items:center;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .floor.on .floor__no{background:rgba(61,225,198,.2);color:var(--acc)}
  .floor__ct{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}

  /* ---------- 右侧 ---------- */
  #right{position:absolute;right:18px;top:78px;bottom:18px;width:346px;zoom:var(--hud-scale);display:flex;flex-direction:column;gap:14px;z-index:9;max-height:none;overflow:auto;scrollbar-width:none}
  #right::-webkit-scrollbar{display:none}
  #right > .panel{position:relative;left:auto;right:auto;top:auto;bottom:auto}
  #card{position:relative;display:none}
  #card.show{display:block;animation:cardIn .22s cubic-bezier(.2,0,0,1) both}
  #card.show.is-out{animation:cardOut .16s ease-out both;pointer-events:none}
  @keyframes cardIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes cardOut{from{opacity:1;transform:none}to{opacity:0;transform:translateY(4px)}}
  #card .panel__head b{margin-left:0;margin-right:26px;color:var(--dim)}
  #cardx{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line-2);background:var(--surface);color:var(--dim);cursor:pointer;z-index:2;display:grid;place-items:center;padding:0;transition:background-color .15s ease,color .15s ease,transform .12s ease}
  #cardx::before{content:"";position:absolute;inset:-6px;border-radius:50%}
  #cardx svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round}
  #cardx:active{transform:scale(.96)}
  #cardx:hover{color:var(--ink);background:var(--surface-hover)}
  .card__title{display:flex;align-items:center;gap:10px;padding:0 16px 8px}
  .card__title .glyph{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:16px;flex:none}
  .card__title b{font-size:16px;font-weight:650;line-height:1.3;overflow-wrap:anywhere;word-break:normal;text-wrap:pretty}
  .card__title span{display:block;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:2px}
  .card__status{margin:0 16px;display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 11px;border-radius:999px;font-family:var(--mono);font-size:11.5px;border:1px solid;color:var(--c,var(--dim));border-color:color-mix(in srgb,var(--c,var(--dim)) 45%,transparent);background:color-mix(in srgb,var(--c,var(--dim)) 12%,transparent)}
  .card__status[data-status="working"]{--c:var(--acc)}
  .card__status[data-status="need_me"]{--c:var(--amber)}
  .card__status[data-status="stuck"]{--c:var(--red)}
  .card__status[data-status="done"]{--c:var(--green)}
  .card__status[data-status="resting"]{--c:var(--dim)}
  .card__grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px 16px 4px}
  .card__grid div{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px}
  .card__grid b{display:block;font-family:var(--mono);font-size:19px;font-weight:650;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .card__grid span{font-family:var(--mono);font-size:9.5px;letter-spacing:1.2px;color:var(--dim)}
  .card__row{display:flex;justify-content:space-between;gap:12px;margin:10px 16px 0;padding-top:10px;border-top:1px solid var(--line);font-family:var(--mono);font-size:11.5px;color:var(--dim)}
  .card__row b{color:var(--ink);font-weight:500;text-align:right;overflow-wrap:anywhere;word-break:normal;max-width:220px;text-wrap:pretty}
  .card__foot{height:10px}

  #checks .panel__body{display:flex;flex-direction:column;gap:7px}
  .check{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--dim);font-family:var(--mono)}
  .check i{width:15px;height:15px;border-radius:5px;border:1px solid var(--line-2);display:grid;place-items:center;font-style:normal;font-size:10px;color:transparent}
  .check i svg{width:10px;height:10px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .check.ok{color:var(--ink)}
  .check.ok i{background:var(--check-bg);border-color:var(--check-line);color:var(--green)}

  /* ---------- 动态 ---------- */
  #feed{left:358px;right:382px;bottom:12px;width:auto;max-height:140px;zoom:var(--hud-scale);display:flex;flex-direction:column;overflow:hidden}
  #feed .panel__body{display:flex;flex-direction:column;gap:2px;overflow:auto;min-height:0}
  .evt{display:flex;align-items:center;gap:9px;padding:6px 6px;min-height:26px;flex:none;font-size:12.5px;color:var(--dim);white-space:nowrap;overflow:hidden}
  .evt .t{font-family:var(--mono);font-size:10.5px;color:var(--dim-2);flex:none;font-variant-numeric:tabular-nums}
  .evt i{width:6px;height:6px;border-radius:50%;flex:none}
  .evt b{color:var(--ink);font-weight:600;flex:none;max-width:150px;overflow:hidden;text-overflow:ellipsis}
  .evt span{overflow:hidden;text-overflow:ellipsis}
  .evt.empty{color:var(--dim-2);font-family:var(--mono);font-size:11px;letter-spacing:1px}
  .empty{padding:16px 10px 18px;text-align:center;font-family:var(--mono);font-size:11px;line-height:1.9;color:var(--dim)}
  .empty span{color:var(--dim-2)}

  /* ---------- 用量 ---------- */
  #meter{position:relative;right:auto;bottom:auto;width:auto;flex:none}
  #meter .panel__body{padding:0 16px 16px}
  #meter .big{font-family:var(--mono);font-size:40px;font-weight:650;letter-spacing:-2px;line-height:1.05;margin-top:2px}
  #meter .big small{font-size:14px;font-weight:500;color:var(--dim);letter-spacing:0;margin-left:6px}
  #meter .sub{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:8px}
  #meter .sub b{color:var(--ink);font-weight:500}

  /* ---------- 余额 ---------- */
  #balance .panel__body{padding:0 16px 16px}
  #balance .big{font-family:var(--mono);font-size:32px;font-weight:650;letter-spacing:-1px;line-height:1.05;margin-top:2px}
  #balance .big small{font-size:12px;font-weight:500;color:var(--dim);letter-spacing:0;margin-left:6px}
  #balance .sub{display:flex;justify-content:space-between;gap:10px;font-family:var(--mono);font-size:11px;color:var(--dim);margin-top:6px}
  #balance .sub b{color:var(--ink);font-weight:500}

  /* ---------- 提示/空态 ---------- */
  #focusChip{position:fixed;left:50%;top:92px;transform:translateX(-50%);z-index:11;display:flex;align-items:center;gap:10px;padding:6px 6px 6px 14px;border:1px solid var(--focus-line);border-radius:999px;background:var(--chip);backdrop-filter:blur(14px);font-family:var(--mono);font-size:11.5px;color:var(--ink);white-space:nowrap}
  #focusChip[hidden]{display:none}
  #focusChip .focus__dot{width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 8px var(--acc)}
  #focusChip button{position:relative;height:26px;padding:0 12px;border-radius:999px;border:0;background:var(--focus-btn);color:var(--acc);font-family:var(--mono);font-size:11px;font-weight:600;cursor:pointer;transition:background-color .15s ease,transform .12s ease}
  #focusChip button:hover{background:var(--focus-btn-hi)}
  #focusChip button:active{transform:scale(.96)}
  #focusChip button::before{content:"";position:absolute;inset:-7px;border-radius:999px}
  #focusChip button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
  #credit{position:absolute;left:24px;bottom:5px;z-index:8;font-family:var(--mono);font-size:9.5px;letter-spacing:.3px;color:var(--dim-2);opacity:.72;pointer-events:none;white-space:nowrap}
  #credit b{font-weight:600;color:var(--dim)}
  #hint{position:fixed;left:50%;top:92px;transform:translateX(-50%);z-index:8;font-family:var(--mono);font-size:11px;letter-spacing:1.2px;color:rgba(138,148,163,.85);background:var(--hint);border:1px solid var(--line);border-radius:999px;padding:7px 14px;backdrop-filter:blur(12px);transition:opacity .8s;white-space:nowrap}
  #hint.hide{opacity:0}
  #hint.lower{top:auto;bottom:20px}
  #offline{position:absolute;left:50%;top:88px;transform:translateX(-50%);z-index:20;display:none;font-family:var(--mono);font-size:11.5px;color:var(--amber);background:rgba(255,184,107,.12);border:1px solid rgba(255,184,107,.35);border-radius:999px;padding:6px 14px}
  #offline.show{display:block}
  .lbl{position:absolute;transform:translate(-50%,-100%);max-width:250px;overflow:hidden;text-overflow:ellipsis;padding:3px 8px;border-radius:999px;border:1px solid var(--line-2);background:var(--label);color:var(--ink);font-family:var(--mono);font-size:10.5px;white-space:nowrap;backdrop-filter:blur(6px);transition:border-color .2s,transform .2s}
  .lbl em{font-style:normal;color:var(--dim);margin-left:6px;font-variant-numeric:tabular-nums}
  .lbl:hover{border-color:rgba(61,225,198,.6);transform:translate(-50%,-100%) scale(1.06)}
  .lbl.on{border-color:var(--acc);box-shadow:0 0 14px rgba(61,225,198,.35)}
  .lbl .badge{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:5px;vertical-align:1px}
  .floorlbl{position:absolute;transform:translate(-50%,-50%);font-family:var(--mono);font-size:11px;letter-spacing:2px;color:rgba(138,148,163,.9);padding:3px 9px;border:1px solid var(--line-2);border-radius:999px;background:var(--label);white-space:nowrap}
  .floorlbl b{color:var(--ink);font-weight:600;margin-left:6px;letter-spacing:0}
  .officeTag{font-family:var(--mono);font-size:9px;letter-spacing:1.4px;color:var(--dim);padding:2px 7px;border:1px solid var(--line-2);border-radius:999px;background:var(--label);white-space:nowrap;backdrop-filter:blur(6px)}
  @media (max-width:1180px){
    #left{width:280px}
    #right{width:300px}
    #feed{left:312px;right:332px}
    .brand span{display:none}
  }
  @media (max-width:980px){
    #left{width:248px}
    #right{width:268px}
    #feed{left:280px;right:300px}
    .pill{padding:0 9px;font-size:11px}
    .pill b{font-size:12px}
  }
  /* 窄屏：左右两栏改成上下两块，避免互相挤压 */
  @media (max-width:820px){
    #left{left:12px;right:12px;width:auto;top:86px;bottom:auto;max-height:32vh}
    #board{flex:1;min-height:0;max-height:32vh}
    #right{left:12px;right:12px;width:auto;top:calc(86px + 32vh + 12px);bottom:12px;overflow:auto}
    #feed{display:none}
    #top{left:12px;right:12px;height:52px;padding:0 12px}
    #top .brand b{font-size:15px}
    #top .brand span{display:none}
    .pills{gap:5px}
    .pill{padding:0 8px;height:26px;font-size:10.5px}
    .pill b{font-size:11.5px}
    #clock{display:none}
    #hint{display:none}
    #focusChip{top:70px;max-width:calc(100vw - 24px)}
    #offline{top:70px}
    #floors .panel__body{max-height:26vh}
  }
  @media (max-width:560px){
    #top .pills .pill:nth-child(n+3){display:none}
    #left{max-height:28vh}
    #board{max-height:28vh}
    #right{top:calc(86px + 28vh + 12px)}
    #meter .big{font-size:32px}
  }
  @media (prefers-reduced-motion:reduce){
    #card.show,#card.show.is-out{animation:none}
    .row,.floor,#cardx,#focusChip button{transition:none!important}
  }
  @media (max-height:760px){
    #floors{display:none}
    #feed{max-height:112px}
  }
  .mcpTag{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:2.4px;color:#d7f3ff;padding:1px 8px 1px 9px;border:1px solid rgba(92,196,255,.38);border-radius:5px;background:linear-gradient(180deg,rgba(8,22,36,.74),rgba(2,8,14,.82));backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);text-shadow:0 0 6px rgba(90,205,255,.95),0 0 18px rgba(70,150,255,.5);box-shadow:0 0 14px rgba(70,170,255,.22),inset 0 0 10px rgba(60,150,255,.12);white-space:nowrap;pointer-events:none}
  .mcpTag .x{color:#74d4ff;font-size:12px;font-weight:700;line-height:1;text-shadow:0 0 8px rgba(92,196,255,.95)}

  /* ---------- HUD 重排：办公室为主，HUD 为薄仪表层 ---------- */
  #top{top:12px;height:50px;padding:0 14px;gap:12px;left:12px;right:12px}
  #left{left:12px;top:66px;width:300px;height:calc(100vh - 96px);max-height:calc(100vh - 96px)}
  #board{height:100%;max-height:none;flex:1 1 auto;overflow:hidden}
  #board .panel__body{flex:1 1 auto;min-height:0;max-height:none;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--scroll-hi) transparent}
  #right{right:12px;top:66px;bottom:auto;width:320px;max-height:calc(100vh - 78px);overflow-y:auto;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:var(--scroll-hi) transparent}
  #right::-webkit-scrollbar{display:block;width:6px}
  #right::-webkit-scrollbar-thumb{background:var(--scroll-hi);border-radius:3px}
  #checks .panel__body{padding:0 12px 10px;gap:4px}
  #checks .panel__head,#floors .panel__head{padding-top:10px;padding-bottom:4px}
  #floors .panel__body{max-height:none;padding-bottom:4px}
  #feed{left:370px;right:370px;bottom:10px;height:136px;max-height:136px}
  #feed .panel__head{height:26px;padding-top:8px}
  #feed .panel__body{flex:1 1 auto;min-height:0;max-height:none;padding:0 12px 8px;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:var(--scroll-hi) transparent;gap:3px}
  #card .panel__head{padding-top:10px}
  #card .card__title{padding-bottom:4px}
  #card .card__grid div{padding:7px 8px}
  #card .card__row{padding-top:5px;padding-bottom:5px}
  .hstat b{font-size:14px}
  #intro{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,rgba(5,11,18,.26),rgba(3,7,11,.84));transition:opacity .55s ease,visibility .55s ease}
  #intro.done{opacity:0;visibility:hidden;pointer-events:none}
  .intro__loader{display:grid;justify-items:center;gap:14px;color:var(--ink)}
  .intro__spinner{position:relative;width:76px;height:76px;border-radius:50%;filter:drop-shadow(0 0 18px rgba(61,225,198,.2))}
  .intro__spinner i{position:absolute;inset:0;border-radius:50%;border:2px solid transparent;border-top-color:var(--acc);border-right-color:color-mix(in srgb,var(--acc) 32%,transparent);animation:intro-spin 1.05s linear infinite}
  .intro__spinner i:nth-child(2){inset:9px;border-top-color:#5b8cff;border-left-color:rgba(91,140,255,.34);animation-duration:.78s;animation-direction:reverse}
  .intro__spinner i:nth-child(3){inset:18px;border-top-color:rgba(233,238,245,.78);border-bottom-color:rgba(233,238,245,.18);animation-duration:.54s}
  .intro__spinner::after{content:"";position:absolute;inset:31px;border-radius:50%;background:radial-gradient(circle,var(--acc) 0,rgba(61,225,198,.35) 38%,transparent 70%);box-shadow:0 0 20px rgba(61,225,198,.55);animation:intro-pulse 1.6s ease-in-out infinite}
  .intro__label{font-family:var(--mono);font-size:9.5px;letter-spacing:3.2px;color:var(--dim);margin-top:2px}
  .intro__hint{font-family:var(--mono);font-size:9px;letter-spacing:1.2px;color:var(--dim-2);opacity:.7}
  @keyframes intro-spin{to{transform:rotate(360deg)}}
  @keyframes intro-pulse{0%,100%{transform:scale(.82);opacity:.55}50%{transform:scale(1.1);opacity:.95}}
  @media (prefers-reduced-motion:reduce){.intro__spinner i,.intro__spinner::after{animation:none}#intro{transition:none}}
</style>
</head>
<body>
<div id="app">
  <div id="stage"></div>
  <div id="labels"></div>

  <header id="top">
    <div class="brand"><b>Office</b><span>DSH 实时会话办公室</span></div>
    <div id="headStats">
      <div class="hstat tokens" title="本周 token 用量"><span>本周</span><b id="headTokens">—</b><small>tokens</small></div>
      <div class="hstat" title="DeepSeek 平台余额"><span>余额</span><b id="headBalance">—</b></div>
    </div>
    <div class="pills" id="pills"></div>
    <div id="clock"><i></i><span>实时</span></div>
  </header>

  <div id="left">
    <aside id="board" class="panel">
      <div class="panel__head"><span>本周 TOKEN 占比</span><b>TOP</b></div>
      <div class="panel__body" id="boardBody"></div>
    </aside>
  </div>

  <aside id="right">
    <section id="card" class="panel">
      <button id="cardx" title="关闭" aria-label="关闭详情"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      <div class="panel__head"><span>会话详情</span><b id="cardTeam"></b></div>
      <div class="card__title"><span class="glyph" id="cardGlyph">◆</span><div><b id="cardName"></b><span id="cardSub"></span></div></div>
      <div class="card__status" id="cardStatus"></div>
      <div class="card__grid">
        <div><b id="cardRuns">0</b><span>今日执行</span></div>
        <div><b id="cardShare">0%</b><span>本周占比</span></div>
        <div><b id="cardTokens">0</b><span>今日 TOKEN</span></div>
      </div>
      <div class="card__row"><span>调度</span><b id="cardSched"></b></div>
      <div class="card__row"><span>当前</span><b id="cardNow"></b></div>
      <div class="card__foot"></div>
    </section>
    <section id="checks" class="panel">
      <div class="panel__head"><span>运行检查</span><b id="checkScore"></b></div>
      <div class="panel__body" id="checkBody"></div>
    </section>

    <aside id="floors" class="panel">
      <div class="panel__head"><span>楼层 / 团队</span><b id="floorCount"></b></div>
      <div class="panel__body" id="floorBody"></div>
    </aside>
  </aside>

  <footer id="feed" class="panel">
    <div class="panel__head"><span>动态</span><b>实时</b></div>
    <div class="panel__body" id="feedBody"></div>
  </footer>

  <div id="focusChip" hidden>
    <span class="focus__dot"></span>
    <span id="focusText">正在查看 1 层</span>
    <button type="button" id="focusBack">全局视角</button>
  </div>
  <div id="credit">Catora<b>™</b> © 2026 mayc0202 · 商标申请中</div>

  <div id="hint">左键点楼层聚焦 · 右键返回全局 · 拖动旋转 · 滚轮缩放</div>
  <div id="offline">正在连接 DSH 会话数据…</div>

  <div id="intro" role="status" aria-live="polite">
    <div class="intro__loader">
      <div class="intro__spinner" aria-hidden="true"><i></i><i></i><i></i></div>
      <div class="intro__label">BUILDING OFFICE</div>
      <div class="intro__hint">点击跳过</div>
    </div>
  </div>
</div>
<script>/*__BUNDLE__*/</script>
</body>
</html>
